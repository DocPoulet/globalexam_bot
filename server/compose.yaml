services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: community
      POSTGRES_DB: community
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    volumes:
      - community_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://community:${POSTGRES_PASSWORD}@db:5432/community
      COMMUNITY_WRITES_ENABLED: ${COMMUNITY_WRITES_ENABLED:-false}
      COMMUNITY_MIN_CONFIRMATIONS: ${COMMUNITY_MIN_CONFIRMATIONS:-3}
      COMMUNITY_READ_LIMIT_DAY: ${COMMUNITY_READ_LIMIT_DAY:-500}
      COMMUNITY_WRITE_LIMIT_DAY: ${COMMUNITY_WRITE_LIMIT_DAY:-200}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  community_pgdata:

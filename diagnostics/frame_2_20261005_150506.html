<html><head></head><body><script>var AWIN = AWIN || {};AWIN.Tracking = AWIN.Tracking || {};AWIN.payload = {"advertiser":{"config":{"advertiserId":"65530","campaignId":"27944","pagetype":"generic","accessConfig":{"location":false,"referrer":false,"sale":true,"basket":true,"zxParams":["pagetype","products","category","identifier"]}}},"plugin":{"publisherId":"","advertiserId":25291,"protocol":"https://","zxParams":{"products":[]},"basket":[]}};AWIN.pluginName = "ReachGroup";</script><script>var AWIN = AWIN || {};

AWIN.Tracking = (function (pluginName, payload) {

	var scriptAppend = function (sScriptSrc, sScriptContent, onLoadCallback, oScriptTagParams, tcfVendorId) {

		}

			for (var name in oScriptTagParams) {

			}
		}

		// attach an event handler
		if (onLoadCallback) {
			// send Debug EVent when onLoadCallback is not a function. TODO This is temporary change, should be removed after analysis
			if (typeof onLoadCallback !== 'function') {
				AWIN.Tracking.sendDebugEvent({
					severity: 'warning',
					source: { app: 'AMT', category: 'scriptAppend' },
					body: {
						message: 'onLoadCallback is not a function in mastertag-sb.',
						url: sScriptSrc || 'inline script',
						advertiserId: AWIN.Tracking.iMerchantId,
					},
				});
			}

			// for IE
			scriptNode.onreadystatechange = function () {
				if (scriptNode.readyState == 'complete' || scriptNode.readyState == 'loaded') {
					onLoadCallback();
				}
			};

			// for everything elses
			scriptNode.onload = onLoadCallback;

		// append node
		if (sScriptSrc) {
			AWIN.Tracking.Consent.getGdprAppends(
				tcfVendorId,
				AWIN.Tracking.getQueryParameterDelimiter(scriptNode.src),
				function (gdprAppends) {

	var frameAppend = function (sFrameSrc, tcfVendorId) {

		}
		return bits.join('&');

	(function (awinTrackingConsent) {

		var cmpFrame;

			var frame = window;

			// map of calls
			var cmpCallbacks = {};
			while (frame) {
				try {
					/**
					 * throws a reference error if no frames exist
					 */
					if (frame.frames['__tcfapiLocator']) {

					}
				} catch (ignore) {}

				}

			 * From the caller's perspective, this function behaves identically to the
			 * CMP API's __tcfapi call

			window.__tcfapi = function (cmd, version, callback, arg) {

				} else {
					var callId = Math.random() + '';
					var msg = {
						__tcfapiCall: {
							command: cmd,
							parameter: arg,
							version: version,
							callId: callId,
						},
					};

					 * map the callback for lookup on response
					 */
					cmpCallbacks[callId] = callback;
					cmpFrame.postMessage(msg, '*');

				 */
				var json = {};

					 * if this isn't valid JSON then this will throw an error

					 */

						cmpCallbacks[payload.callId] = null;

										} else {

(function ($r) {
	if ($r.terminate === true) {
		return;
	}

	if ('undefined' === typeof $r.advertiserId || 'undefined' === typeof $r.campaignId) {
		return;
	}

	var pagetype = $r.pagetype || AWIN.Tracking.fetchZxParam('pagetype');

	if (AWIN.Tracking.Sale) {
		pagetype = 'checkout';
	} else if ('checkout' === pagetype.toLowerCase()) {
		AWIN.Tracking.Sale = {};
	}

	$r.combineProducts = function (products) {
		if (typeof products === 'string') {
			products = JSON.parse(products);
		}

		var output = '';
		var sep = '';

		for (var i = 0; i < products.length; i++) {
			output += sep + products[i].identifier + '|' + products[i].quantity;
			sep = ',';
		}

		return output;
	};

	$r.fetchBasketData = function () {
		var products = AWIN.Tracking.getBasketData();
		for (var i = 0; i < products.length; i++) {
			products[i].identifier = products[i].id;
			delete products[i].id;
		}
		return products;
	};

	var url = $r.url + '?a=' + $r.advertiserId + '&version=1';

	switch (pagetype.toLowerCase()) {
		case 'basket':
			url +=
				'&' +
				AWIN.Tracking.buildQueryString({
					event: 'basket',
					cat: $r.campaignId,
					items: $r.combineProducts(AWIN.Tracking.fetchZxParam('products') || $r.fetchBasketData()),
					segment: $r.category || AWIN.Tracking.fetchZxParam('category') || '',
				});
			break;
		case 'category':
			url +=
				'&' +
				AWIN.Tracking.buildQueryString({
					segment: $r.category || AWIN.Tracking.fetchZxParam('category'),
				});
			break;
		case 'checkout':
			url +=
				'&' +
				AWIN.Tracking.buildQueryString({
					event: 'transaction',
					cat: $r.campaignId,
					items: $r.combineProducts(AWIN.Tracking.fetchZxParam('products') || $r.fetchBasketData()),
					segment: $r.category || AWIN.Tracking.fetchZxParam('category') || '',
				});
			break;
		case 'search':
			url +=
				'&' +
				AWIN.Tracking.buildQueryString({
					segment: 'suchergebnisse',
				});
			break;
		case 'product':
			url +=
				'&' +
				AWIN.Tracking.buildQueryString({
					event: 'view',
					cat: $r.campaignId,
					segment: $r.category || AWIN.Tracking.fetchZxParam('category'),
					items: $r.identifier || AWIN.Tracking.fetchZxParam('identifier'),
				});
			break;
		case 'registration':
			return;
		case 'generic':
		case 'home':
			break;

			return;
	}
